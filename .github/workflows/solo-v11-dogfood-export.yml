name: SOLO v1.1 external dogfood export

on:
  push:
    branches:
      - tmp/solo-v11-dogfood

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/solo-v11-dogfood
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: tyf-authorship-dogfood-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
