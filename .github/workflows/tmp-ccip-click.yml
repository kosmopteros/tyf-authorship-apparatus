name: Temporary CCIP click scrape
on:
  push:
    branches: [tmp-ccip-click-20260817]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Click through CCIP directory
        id: scrape
        continue-on-error: true
        run: python tools/ccip_click_scrape.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccip-click-output-2026-08-17
          path: ccip-click-output/
          if-no-files-found: warn
          retention-days: 1
      - if: steps.scrape.outcome == 'failure'
        run: exit 1
